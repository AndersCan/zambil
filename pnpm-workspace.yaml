packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  onnxruntime-node: false

catalogMode: prefer

# Every dependency version lives here. A package.json refers to it as "catalog:".
catalog:
  "@types/node": ^24
  js-yaml: ^5.5.0
  onnxruntime-node: ^1.31.1
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
